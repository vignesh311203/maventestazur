name: CI
on:
  push:
    branches: ["main", "build/**"]
  pull_request:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd frontend && npm install && npm run build
  browser-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Configure disposable test stack
        run: |
          cp .env.example .env
          sed -i 's/^APP_SECRET_KEY=.*/APP_SECRET_KEY=ci-only-test-secret-not-for-production-123456789/' .env
          sed -i 's/^BOOTSTRAP_ADMIN_EMAIL=.*/BOOTSTRAP_ADMIN_EMAIL=admin@example.com/' .env
          sed -i 's/^BOOTSTRAP_ADMIN_PASSWORD=.*/BOOTSTRAP_ADMIN_PASSWORD=TestAdminPass123!/' .env
      - name: Start PostgreSQL, Redis, API and web
        run: docker compose up --build -d
      - name: Wait for API and frontend
        run: |
          curl --fail --retry 60 --retry-delay 2 --retry-all-errors http://localhost:8000/health
          curl --fail --retry 60 --retry-delay 2 --retry-all-errors http://localhost:5173/
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Verify ten application checklist items
        working-directory: frontend
        env:
          TEST_ADMIN_EMAIL: admin@example.com
          TEST_ADMIN_PASSWORD: TestAdminPass123!
        run: npm run test:e2e
      - name: Show stack logs if test failed
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove disposable test stack
        if: always()
        run: docker compose down -v
