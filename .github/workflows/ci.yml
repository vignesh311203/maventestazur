name: CI
on:
  push:
    branches: ["main", "build/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest -q
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd frontend && npm install && npm run build
  browser-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Configure disposable test stack
        run: |
          cp .env.example .env
          sed -i 's/^APP_SECRET_KEY=.*/APP_SECRET_KEY=ci-only-test-secret-not-for-production-123456789/' .env
          sed -i 's/^BOOTSTRAP_ADMIN_EMAIL=.*/BOOTSTRAP_ADMIN_EMAIL=admin@example.com/' .env
          sed -i 's/^BOOTSTRAP_ADMIN_PASSWORD=.*/BOOTSTRAP_ADMIN_PASSWORD=TestAdminPass123!/' .env
      - name: Start PostgreSQL, Redis, API and web
        run: docker compose up --build -d
      - name: Wait for API and frontend
        run: |
          curl --fail --retry 60 --retry-delay 2 --retry-all-errors http://localhost:8000/ready
          curl --fail --retry 60 --retry-delay 2 --retry-all-errors http://localhost:5173/
      - name: Check exposed files and API schema version
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/.env)" = "403"
          docker compose exec -T api alembic current | grep '0002_contact_consent'
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Verify ten application checks and remaining module workflows
        working-directory: frontend
        env:
          TEST_ADMIN_EMAIL: admin@example.com
          TEST_ADMIN_PASSWORD: TestAdminPass123!
        run: npm run test:e2e
      - name: Show stack logs if test failed
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove disposable test stack
        if: always()
        run: docker compose down -v

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Scan full Git history for credentials
        run: |
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git --redact --log-opts="--all" /repo
      - name: Check tracked secret and backup paths
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.[^/]+$)|[^/]+\.(pem|key|db|sqlite|dump|sql\.gz)$)' | grep -vE '(^|/)\.env(\.production)?\.example$'; then
            echo "Unexpected tracked credentials or database files"
            exit 1
          fi
      - name: Python dependency and static security checks
        run: |
          python -m pip install pip-audit bandit
          pip-audit -r backend/requirements-dev.txt
          bandit -r backend/app backend/alembic -ll -ii
      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm install --no-audit
          npm audit --audit-level=high
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f compose.production.yml config --quiet

  website-image:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Build same-origin website image
        run: docker build -t metroestate-website:test .
      - name: Start disposable website
        run: |
          docker run -d --name metroestate-website-test -p 127.0.0.1:8080:8000 \
            -e APP_ENV=development -e DATABASE_URL=sqlite:////tmp/metroestate-test.db \
            -e APP_SECRET_KEY=ci-only-website-test-key-not-production \
            -e BOOTSTRAP_ADMIN_EMAIL=admin@example.com \
            -e BOOTSTRAP_ADMIN_PASSWORD=TestAdminPass123! \
            metroestate-website:test
          curl --fail --retry 60 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/ready
          curl --fail http://127.0.0.1:8080/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.env)" = "404"
      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Verify same-origin website
        working-directory: frontend
        env:
          TEST_WEB_URL: http://127.0.0.1:8080
          TEST_API_URL: http://127.0.0.1:8080
          TEST_ADMIN_EMAIL: admin@example.com
          TEST_ADMIN_PASSWORD: TestAdminPass123!
        run: npm run test:e2e
      - name: Show website logs on failure
        if: failure()
        run: docker logs metroestate-website-test
      - name: Remove disposable website
        if: always()
        run: docker rm -f metroestate-website-test
