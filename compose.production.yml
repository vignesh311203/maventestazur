# Use a separate Compose project from the local development stack.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: realestate
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d realestate"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [private]
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set a unique application secret}
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD}@db:5432/realestate
      REDIS_URL: redis://redis:6379/0
      TRUSTED_HOSTS: ${PUBLIC_DOMAIN:?Set the actual HTTPS domain},localhost
      CORS_ORIGINS: https://${PUBLIC_DOMAIN}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      FORWARDED_ALLOW_IPS: 172.30.253.10
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private, proxy]
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    networks: [proxy]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    networks:
      proxy:
        ipv4_address: 172.30.253.10
      public:
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
networks:
  private:
    internal: true
  proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.253.0/24
  public:
